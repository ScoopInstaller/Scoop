name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Need at least 2 commits to properly gather changed files for linting
          fetch-depth: 2
      - name: Install and cache test dependencies
        uses: potatoqualitee/psmodulecache@9e4b63833c22c1768d648e115a9c849afdda22a5 # v6.3
        with:
          modules-to-cache: PSScriptAnalyzer, BuildHelpers, Pester
          shell: ${{ matrix.shell }}
      - name: Run tests
        run: ./test/bin/test.ps1
